<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Juno Agents docs — preview</title>
  <meta name="description" content="Preview of Agents section for docs.junonetwork.io (fork vetting, not official)." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #ff7b7c;
      --base-background-color: #14090a;
      --base-color: #ffebd2;
      --sidebar-background: #1c1011;
      --sidebar-nav-link-color: rgba(255, 235, 210, 0.75);
      --sidebar-nav-link-color--active: #ff7b7c;
      --heading-color: #fff6ea;
      --blockquote-color: rgba(255, 235, 210, 0.7);
      --code-inline-background: rgba(255, 123, 124, 0.12);
      --code-theme-background: #1c1011;
      --border: rgba(255, 235, 210, 0.14);
    }
    body { font-family: "Manrope", "Avenir Next", system-ui, sans-serif; }
    .sidebar { border-right: 1px solid var(--border); }
    .app-name-link { font-weight: 700; letter-spacing: 0.02em; }
    .markdown-section { max-width: 820px; }
    .preview-banner {
      background: rgba(255, 123, 124, 0.15);
      border-bottom: 1px solid var(--border);
      color: var(--base-color);
      padding: 0.65rem 1.25rem;
      font-size: 0.9rem;
    }
    .preview-banner a { color: #ff7b7c; }
  </style>
</head>
<body>
  <div class="preview-banner">
    <strong>Fork preview</strong> — Agents section for vetting before PR to
    <code>CosmosContracts/docs</code>. Not the live
    <a href="https://docs.junonetwork.io">docs.junonetwork.io</a>.
  </div>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "Juno Agents",
      repo: "https://github.com/fraserbrownirl/juno-docs",
      homepage: "agents/README.md",
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: ["agents/", "README.md"],
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md",
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
